# Pinned corpus manifest. Only permissively licensed public repositories.
#
# `epochs` is an ordered list of full commit SHAs: the first is the baseline
# used for calibration, each later one is a drift epoch (new/changed units are
# scored). Epochs here are the last commit on the default branch before the
# 1st of each month; a month with no new commit is omitted.
# Live mode appends the newest default-branch SHA at run time.
#
# Selection (2026-10-19): active Python libraries, 5k-21k lines, 100+ commits
# in the previous 12 months. click and marshmallow predate current models'
# training data; dataframely and chonkie were created in 2025.
