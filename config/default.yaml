# Assay default configuration. Everything that affects results lives here
# and is hashed into each run for reproducibility.
#
# Relative paths resolve against the directory Assay runs from (the project
# root). Any value can be overridden with an ASSAY_<SECTION>__<KEY>
# environment variable, for example ASSAY_STORAGE__ROOT=/tmp/assay or
# ASSAY_CORPUS__UNITS__MIN_LINES=5; values are parsed as YAML.
#
# Model ids are pinned for the whole study; each document also records the
# model's exact revision (for Ollama, the digest), so re-pulled weights are
# detected rather than silently mixed in.

run:
  seed: 20261019
  budget_usd: null # hard cap per run in USD; null means no cap

storage:
  root: data # local directory for the Parquet tables
  duckdb_path: data/marts/assay.duckdb

corpus:
  manifest: config/repos.yaml # pinned repos: url, commit SHAs, license
  cache_dir: corpus_cache # local git checkouts, one directory per commit
  allowed_licenses: [MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC]
  languages: [python, typescript, go]
  units: # which symbols become documentation units
    kinds: [module, class, function]
    min_lines: 3
    include_private: false

generation:
  prompt_version: v1 # config/prompts/generation/<version>.yaml; never edit a used version
  prompt_dir: config/prompts/generation
  max_output_tokens: 1024
  sample_per_partition: 8 # pilot: 8 units x 2 subjects per repository epoch; null = every unit
  subjects: # models that write documentation; provider: ollama | bedrock | openai
    - name: qwen-coder-3b
      provider: ollama
      model_id: qwen2.5-coder:3b
      temperature: 0.0
    - name: phi4-mini
      provider: ollama
      model_id: phi4-mini
      temperature: 0.0

judge:
  rubric_version: v1 # config/rubrics/<version>.yaml; never edit a used version
  rubric_dir: config/rubrics
  runs_per_criterion: 3 # N repeated judgments to measure variance
  max_output_tokens: 1024 # fits the bounded reply: <= 8 issues, then rationale, then score
  variance_study:
    temperatures: [0.0, 0.7]
    subset_size: 50
  criteria: [accuracy, clarity, consistency]
  models: # gemma3 is from neither subject's family; phi4-mini judging its own output is the self-preference check
    - name: gemma3-4b
      provider: ollama
      model_id: gemma3:4b
      temperature: 0.0
    - name: phi4-mini
      provider: ollama
      model_id: phi4-mini
      temperature: 0.0

scoring:
  # Prior weights (sum to 1); fitted weights are learned on the development split only.
  weights:
    referential_integrity: 0.25
    symbol_coverage: 0.15
    structural_completeness: 0.10
    readability: 0.05
    accuracy: 0.20
    clarity: 0.15
    consistency: 0.10
  critical_failures: # force a `reject` decision; the raw composite is still stored
    referential_integrity_below: 0.90
  routing: # applies to non-rejected documents
    publish_at_or_above: 80
    escalate_below: 50

evaluation:
  split:
    development_fraction: 0.6
    group_by: repo # no repo appears in both splits
    stratify_by: [language, unit_kind, contamination_group]
  weight_fit:
    target: overall_rating
    shrink_to_prior: true # lambda chosen by repo-grouped CV on development
  golden_set:
    source_split: development
    size: 100
  baseline:
    models: [ridge, hist_gradient_boosting]
  bootstrap_resamples: 10000
  targets:
    spearman_rho: 0.70
    weighted_kappa: 0.60
    judge_band_stability: 0.90

drift:
  mode: replay # replay: backfill manifest epochs; live: append newest SHA each run
  schedule_cron: "0 12 * * 1" # weekly, live mode
  ks_alpha: 0.01
  psi_floor: 0.2
  ewma_lambda: 0.2
  consecutive_runs_to_alert: 2
  judge_kappa_floor: 0.55
  triggers_on_change: [subject_model, judge_model, prompt_hash, rubric_version]
